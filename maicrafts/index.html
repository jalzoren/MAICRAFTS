<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- FAVICON -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Dynamic Animated Title -->
    <title>Maicrafts</title>
    
    <!-- Google tag (gtag.js) - GDPR Compliant with Consent -->
    <script>
      // Initialize dataLayer
      window.dataLayer = window.dataLayer || [];
      
      // Define gtag function
      function gtag(){dataLayer.push(arguments);}
      
      // Set default consent to DENIED (waiting for user permission)
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'analytics_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });
      
      // Initialize GA with denied consent
      gtag('js', new Date());
      gtag('config', 'G-H6NPMXC4LH', {
        'send_page_view': false,  // Don't send page view until consent
        'anonymize_ip': true
      });
      
      // Store GA ID globally
      window.GA_MEASUREMENT_ID = 'G-H6NPMXC4LH';
      
      // Function to update consent when user accepts
      window.updateGAConsent = function(accepted) {
        if (accepted) {
          gtag('consent', 'update', {
            'ad_storage': 'granted',
            'analytics_storage': 'granted'
          });
          console.log('Google Analytics consent granted');
        } else {
          gtag('consent', 'update', {
            'ad_storage': 'denied',
            'analytics_storage': 'denied'
          });
          console.log('Google Analytics consent denied');
        }
      };
      
      // Check for existing consent from localStorage
      window.checkExistingConsent = function() {
        const hasConsented = localStorage.getItem('cookie_consent_given');
        const preferences = localStorage.getItem('cookie_consent_preferences');
        
        if (hasConsented === 'true' && preferences) {
          try {
            const prefs = JSON.parse(preferences);
            if (prefs.analytics === true) {
              window.updateGAConsent(true);
            } else {
              window.updateGAConsent(false);
            }
          } catch(e) {
            console.error('Error parsing preferences:', e);
          }
        }
      };
    </script>
    
    <!-- Animated Typing Title Script -->
    <script>
      const titleText = "Maicrafts! -";
      const typingSpeed = 200;
      const pauseBeforeDelete = 2000;
      const deleteSpeed = 100;

      let i = 0;
      let isDeleting = false;

      function typeWriter() {
        const currentTitle = isDeleting 
          ? titleText.substring(0, i--) 
          : titleText.substring(0, i++);

        document.title = currentTitle + " ❀";

        if (!isDeleting && i === titleText.length) {
          setTimeout(() => { isDeleting = true; typeWriter(); }, pauseBeforeDelete);
        } else if (isDeleting && i === 0) {
          isDeleting = false;
          setTimeout(typeWriter, 500);
        } else {
          setTimeout(typeWriter, isDeleting ? deleteSpeed : typingSpeed);
        }
      }

      window.onload = () => {
        setTimeout(typeWriter, 800);
        window.checkExistingConsent();
      };
    </script>

    <style>
      @keyframes pulse {
        0% { opacity: 0.7; }
        50% { opacity: 1; }
        100% { opacity: 0.7; }
      }
    </style>
  </head>
  
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
